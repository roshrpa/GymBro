name: Build Android APK

# APK builds only run when started manually (Actions tab -> Run workflow)
on:
  workflow_dispatch:

permissions:
  contents: write

# only the newest push needs to build
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Run logic tests
        run: npm test

      - name: Stamp build number
        run: |
          printf "export const BUILD = %s;\nexport const VERSION = '1.0.0';\n" "${{ github.run_number }}" > src/buildInfo.js
          cat src/buildInfo.js

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GymBro.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymBro-apk
          path: GymBro.apk

      - name: Publish to the "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GymBro (latest APK)
          body: Latest Android build (build ${{ github.run_number }}). Download GymBro.apk and install it on your phone.
          files: GymBro.apk
          make_latest: true
